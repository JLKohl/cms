<div class="card border">

    <!-- panel header-->
     <div class=" card-header bg-light d-flex justify-content-between align-items-center">
        <h3 class="mb-0">Contacts</h3>

            <!-- new contact button -->
        <a href="#" class="btn btn-success btn-sm">
            New Contact
        </a>
     </div>

     <!-- Panel Body -->
    <div class="card-body">
        
        <div *ngFor="let contact of contacts" class="d-flex align-items-center mb-3">

            <img [src]="contact.imageUrl" width="40" class="me-2">

            {{ contact.name }}
        </div>

    </div>


</div>
