<div class="panel panel-default">
    <div class="panel-body">
      <form id="contact-edit" #f="ngForm" (ngSubmit)="onSubmit(f)">
        <div class="row">
          <div class="col-sm-12 form-group">
            <label for="name">Name:</label>
            <input
                type="text"
                id="name"
                name="name"
                required
                [(ngModel)]="contact.name"
                #name="ngModel"
                class="form-control"
                size="120"
                max="120">
          </div>
        </div>
  
        <div class="row">
          <div class="col-sm-12 form-group">
            <label for="email">Email:</label>
            <input
                type="text"
                id="email"
                name="email"
                required
                pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,3}$"
                [(ngModel)]="contact.email"
                #email="ngModel"
                class="form-control"
                size="120"
                max="255">
            
            <div class="text-danger"
                *ngIf="email.touched && email.invalid">
                Enter a valid Email address.
            </div>

          </div>
        </div>


        <div class="row">
          <div class="col-sm-12 form-group">
            <label for="phone">Phone:</label>
            <input
                type="text"
                id="phone"
                name="phone"
                required
                pattern="\D*([2-9]\d{2})(\D*)([2-9]\d{2})(\D*)(\d{4})\D*"
                [(ngModel)]="contact.phone"
                #phone="ngModel"
                class="form-control"
                size="150"
                max="255">
            <div class="text-danger"
                *ngIf="phone.touched && phone.invalid">
                Enter a valid phone number.
            </div>
  
          </div>
        </div>

  
        <div class="row">
          <div class="col-sm-12 form-group">
            <label for="imageUrl">Image URL:</label>
            <input
                type="text"
                id="imageUrl"
                name="imageUrl"
                class="form-control"
                size="150"
                max="255">
          </div>
        </div>
  
        <div class="row">
          <div class="form-group">
            <label for="groupList">Group Contacts:</label>
  
            <div class="row" id="groupList"
                style="min-height: 3rem;" >
                
                <div *ngFor="let contact of groupContacts; let i = index">
                    <app-contact-edit class="col-sm-11" [contact]="contact"></app-contact-edit>
                
                    <button
                    class="btn btn-danger col-sm-2 deleteButton"
                    (click)="onRemoveItem(i)">
                    X
                    </button>
                </div>
              <span class="dragMsg" *ngIf="groupContacts?.length < 1">Drag contacts in group here</span>
            </div>
  
          </div>
        </div>

        <div class="alert alert-danger"
        *ngIf="(!name.valid && name.touched) || (!email.valid && email.touched)">
        The Name and Email fields are required.
        </div>
  
  
        <div class="row">
          <div class="col-xs-12 btn-toolbar">
            <button 
            class="btn btn-success" 
            type="submit"
            [disabled]="!f.valid">
            Save
            </button>

            <button 
            class="btn btn-primary" 
            type="button" 
            (click)="onCancel()" >
            Cancel
            </button>
          </div>
        </div>
  
      </form>
    </div>
  </div>
