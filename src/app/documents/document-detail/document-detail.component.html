<div class="card border">

    <!-- Header -->
    <div class="card-header bg-light">
      <h4 class="mb-0">
        {{ document?.name }}
      </h4>
    </div>
  
    <!-- Body -->
    <div class="card-body">
  
      <p>
        <strong>Description:</strong>
        {{ document?.description }}
      </p>
  
      <p>
        <strong>URL:</strong>
        <a [href]="document?.url" target="_blank">
          Open Document
        </a>
      </p>
  
    </div>
  
  </div>
